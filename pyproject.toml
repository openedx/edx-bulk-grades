[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-bulk-grades"
description = "Support for bulk scoring and grading"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
keywords = [
    "Django",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "Django",
    "django-model-utils",
    "edx-opaque-keys",
    "super-csv",
    "requests",
    "slumber",
]

[project.entry-points."lms.djangoapp"]
bulk_grades = "bulk_grades.apps:BulkGradesConfig"

[project.urls]
Homepage = "https://github.com/openedx/edx-bulk-grades"
Repository = "https://github.com/openedx/edx-bulk-grades"

[dependency-groups]
test-base = [
    "code-annotations",
    "ddt",
    "mock",
    "pytest-cov",
    "pytest-django",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
celery55 = [
    "celery>=5.5,<6.0",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "readme_renderer",
    "sphinx-book-theme",
    "Sphinx",
    "twine",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
include = ["bulk_grades", "bulk_grades.*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
bulk_grades = ["templates/**/*.html"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.semantic_release]
# Explicitly set the tag format (same as default).
tag_format = "v{version}"
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true

[tool.uv]
package = true
default-groups = []
conflicts = [
    [{group = "test"}, {group = "django42"}],
    [{group = "quality"}, {group = "django42"}],
    [{group = "doc"}, {group = "django42"}],
    [{group = "dev"}, {group = "django42"}],
]
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
    "celery<6.0",
]

[tool.edx_lint]
uv_constraints = [
    "celery<6.0",
]

[tool.isort]
indent = '    '
line_length = 120
multi_line_output = 3

[tool.coverage.run]
branch = true
data_file = ".coverage"
source = [
    "bulk_grades",
    "tests",
]
omit = [
    "*migrations*",
    "*admin.py",
    "*static*",
    "*templates*",
    "bulk_grades/settings*",
]
